name: Probe public airline flight schedules
'on':
  push:
    paths:
      - '.github/workflows/public-airline-schedule-probe.yml'
      - 'flight-data/inspect_public_results.py'
  workflow_dispatch:
jobs:
  inspect-public-schedule-results:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only HTML parsers
        run: python -m pip install -q requests beautifulsoup4
      - name: Inspect public airline schedule query result formats
        run: python flight-data/inspect_public_results.py
