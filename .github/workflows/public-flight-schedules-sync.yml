name: Sync public airline flight timetables
'on':
  push:
    paths:
      - '.github/workflows/public-flight-schedules-sync.yml'
      - 'flight-data/sync_public_schedules.py'
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'
permissions:
  contents: write
jobs:
  sync-public-timetables:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install lightweight HTML parsing dependencies
        run: python -m pip install -q requests beautifulsoup4
      - name: Read public, non-authenticated timetables only
        run: python flight-data/sync_public_schedules.py
      - name: Publish data for Abu Al-Faisal website
        run: |
          git config user.name "Abu Al-Faisal Timetable Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-data/schedules.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Refresh public flight timetable data [skip ci]"
            git push origin HEAD:main
          fi
