name: Build Abu Al Faisal Android APK

on:
  push:
    branches:
      - android-office-native-2026
    paths:
      - 'android-office/**'
      - '.github/workflows/build-android-office.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private office app source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install compile platform
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Python for icon preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'android-office/requirements.txt'
      - name: Prepare official Android app icons
        run: |
          pip install -r android-office/requirements.txt
          python android-office/scripts/generate_icons.py
      - name: Build debug signed APK
        run: gradle -p android-office :app:assembleDebug --no-daemon --stacktrace
      - name: Name signed APK
        run: |
          cp android-office/app/build/outputs/apk/debug/app-debug.apk AbuAlFaisal-Office.apk
          file AbuAlFaisal-Office.apk
          sha256sum AbuAlFaisal-Office.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuAlFaisal-Office-Android
          path: AbuAlFaisal-Office.apk
          retention-days: 30
