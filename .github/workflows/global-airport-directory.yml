name: Refresh global airport directory
'on':
  push:
    paths:
      - 'flight-data/build_airport_directory.py'
      - '.github/workflows/global-airport-directory.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 3 1 * *'
permissions:
  contents: write
jobs:
  build-airports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests
      - name: Build compact public domain airport directory
        run: python flight-data/build_airport_directory.py
      - name: Update directory from open-data source
        run: |
          git config user.name "Abu Al Faisal Airport Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-data/airports-world.json
          if ! git diff --cached --quiet; then
            git commit -m "Update international airport search directory [skip ci]"
            git push origin HEAD:main
          fi
